---
layout: base
---

<header class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}
      <span class="section-label">{{ page.eyebrow }}</span>
    {% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</header>

{{ content }}
