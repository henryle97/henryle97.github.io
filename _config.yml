# --- Site ---------------------------------------------------------------- #

title: Henry Le — Senior AI Engineer
description: >-
  Senior AI Engineer with seven years shipping AI to production — computer
  vision, document intelligence, and agentic LLM systems. Hanoi, Vietnam.
author: Le Van Hoang
url: "https://henryle97.github.io"
baseurl: ""
lang: en

# Personal details, links, experience, projects and skills all live in _data/.
# Edit those files rather than this one when updating content.

# --- Navigation ------------------------------------------------------------ #

nav-links:
  - title: Projects
    url: /projects/
  - title: About
    url: /about/

# --- Social sharing -------------------------------------------------------- #

# Image used for Open Graph / Twitter cards. Swap for a 1200x630 card when
# one exists.
share-img: /assets/img/profile.jpg

# --- Analytics (optional) -------------------------------------------------- #

# Set a Google Analytics 4 measurement ID to enable tracking, e.g. G-XXXXXXXXXX
#gtag: ""

# --- Build ----------------------------------------------------------------- #

title-separator: "·"
timezone: "Asia/Ho_Chi_Minh"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/

plugins:
  - jekyll-sitemap
