{%- if layout.common-ext-js %}
  {%- for js in layout.common-ext-js %}
    {%- include ext-js.html js=js %}
  {%- endfor %}
{%- endif %}

{%- if layout.common-js %}
  {%- for js in layout.common-js %}
<script src="{{ js | relative_url }}" defer></script>
  {%- endfor %}
{%- endif %}

{%- if page.js %}
  {%- for js in page.js %}
<script src="{{ js | relative_url }}" defer></script>
  {%- endfor %}
{%- endif %}
