{%- assign profile = site.data.profile -%}
<nav class="nav" aria-label="Primary">
  <div class="wrap nav-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">
      {{ profile.name }} <span class="nav-brand-role">· {{ profile.role }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation">
      <span class="nav-toggle-bars"></span>
    </button>

    <div class="nav-menu" id="nav-menu">
      <ul class="nav-links">
        {%- for link in site.nav-links %}
        <li>
          <a class="nav-link{% if page.url == link.url %} is-active{% endif %}" href="{{ link.url | relative_url }}">{{ link.title }}</a>
        </li>
        {%- endfor %}
        <li>
          <a class="nav-cta" href="{{ profile.links.resume | relative_url }}">
            {% include icon.html name="file" %} Resume
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
